[settings]
auto_install = false

[tools]
bun = "1.4.3"
lua = "5.2.4"
stylua = "2.3.1"
uv = "0.12.13"
trunk = "1.3.4"
ruff = "0.17.1"
ty = "0.0.89"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
hadolint = "2.15.1"
"github:betterleaks/betterleaks" = "1.9.0"

[env]
TRUNK_TELEMETRY = "off"

[tasks.setup]
description = "Verify the pinned toolchain and prepare locked Python/Lua dependencies without launching Factorio"
run = "bun tools/cli.ts setup"

[tasks.engine-provision]
description = "Explicitly download and verify the pinned Linux ARM64 Factorio/Bun runtime and Docker image"
run = "bun tools/cli.ts engine-provision"

[tasks.dependencies-provision]
description = "Explicitly provision required pinned mod archives for one mod or --all; --from selects local archives"
run = "bun tools/cli.ts dependencies-provision"

[tasks.modkit]
description = "Run the canonical Effect CLI; pass its command and explicit target after --"
run = "bun tools/cli.ts"

[tasks.mods]
description = "Read offline fleet metadata, verification freshness and prepared-release state"
run = "bun tools/cli.ts mods"

[tasks.project]
description = "Run product-owned Effect CLI commands: <mod> -- <command> [options]"
run = "bun tools/cli.ts project"

[tasks.check]
description = "Read-only source-quality checks; pass a mod ID or --all"
run = "bun tools/cli.ts check"

[tasks.lint]
description = "Run project-aware Lua linting for an explicit mod"
run = "bun tools/cli.ts lint"

[tasks.format-check]
description = "Read-only formatting checks; pass a mod ID or --all"
run = "bun tools/cli.ts format-check"

[tasks.format]
description = "Format source without semantic fixes; pass a mod ID or --all"
run = "bun tools/cli.ts format"

[tasks.typecheck]
description = "Run minimum-version Factorio API typechecking for an explicit mod"
run = "bun tools/cli.ts typecheck"

[tasks.test-model]
description = "Run a mod's offline model regressions without launching Factorio"
run = "bun tools/cli.ts test-model"

[tasks.test]
description = "Run an isolated mod engine suite; select --profile base or space-age"
run = "bun tools/cli.ts test"

[tasks.perf]
description = "Measure a declared fixed-save scenario with independent processes and separate correctness controls"
run = "bun tools/cli.ts perf"

[tasks.perf-compare]
description = "Qualify and compare two explicit performance run IDs without launching Factorio"
run = "bun tools/cli.ts perf-compare"

[tasks.test-ui]
description = "Run native UI assertions for an explicit mod; select --language"
run = "bun tools/cli.ts test-ui"

[tasks.gallery]
description = "Render a mod's native Extreme-quality gallery; select --language"
run = "bun tools/cli.ts gallery"

[tasks.verify]
description = "Verify the workspace or one selected mod; --plan previews without running checks"
run = "bun tools/cli.ts verify"

[tasks.runs]
description = "Read registered workspace/mod run state; --active, --run or cursor-based listing"
run = "bun tools/cli.ts runs"

[tasks.logs]
description = "Read bounded run logs for an explicit mod or --workspace; --follow never controls the producer"
run = "bun tools/cli.ts logs"

[tasks.studio]
description = "Run, inspect, capture and promote an isolated source-backed tuning session"
run = "bun tools/cli.ts studio"

[tasks.package]
description = "Build and validate the deterministic release ZIP for an explicit mod"
run = "bun tools/cli.ts package"

[tasks.mod-status]
description = "Read one mod's installed archives and enabled state in the normal Factorio profile"
run = "bun tools/cli.ts mod-status"

[tasks.mod-load]
description = "Install a local ZIP for normal play, backing up the selected save and previous mod state"
run = "bun tools/cli.ts mod-load"

[tasks.mod-unload]
description = "Disable one mod without deleting its archive; back up the selected save first"
run = "bun tools/cli.ts mod-unload"

[tasks.mod-restore]
description = "Restore the exact mod state recorded in a deployment receipt without overwriting saves"
run = "bun tools/cli.ts mod-restore"

[tasks.package-smoke]
description = "Build and smoke an explicit mod's exact release ZIP in its declared profiles"
run = "bun tools/cli.ts package-smoke"

[tasks.release-version]
description = "Set an explicit mod's newer version and authored changelog note; never publishes"
run = "bun tools/cli.ts release-version"

[tasks.release-prepare]
description = "Verify, smoke the ZIP, render fresh UI/gallery, and seal a local release bundle"
run = "bun tools/cli.ts release-prepare"

[tasks.release-status]
description = "Read live Portal version/gallery and compare the prepared bundle; never publishes"
run = "bun tools/cli.ts release-status"

[tasks.release-publish]
description = "PUBLISH the exact prepared version, replace its listing gallery, and sync listing copy"
run = "bun tools/cli.ts release-publish"

[tasks.gallery-publish]
description = "PUBLISH only the prepared gallery for the exact latest Portal ZIP"
run = "bun tools/cli.ts gallery-publish"

[tasks.listing-publish]
description = "PUBLISH only prepared listing fields for the latest Portal version"
run = "bun tools/cli.ts listing-publish"

[tasks.checkpoint]
description = "Verify every mod and commit locally; --plan is read-only; never pushes"
run = "bun tools/cli.ts checkpoint"

[tasks.vac]
description = "Verify every mod, commit and push the exact commit; --plan is read-only"
run = "bun tools/cli.ts vac"
