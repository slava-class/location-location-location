[project]
name = "factorio-mod-workshop-tools"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["jsonschema==4.26.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".factorio-test", ".trunk", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["tools", "mods"]
exclude = [".factorio-test", ".trunk", "node_modules", "dist"]
