[mod-setting-description]
no-alt-needed-hover=Show applicable recipes, modules, requests, contents, filters and configuration on the entity actually selected by the engine. Native ALT retains its own ordinary information; this mod does not draw a second copy.
no-alt-needed-nearby-recipes=Recipe icons around the hovered entity or pointer on the viewed surface, not around your character. The focus experiment chooses pointer tracking or retained entity focus.
no-alt-needed-experiment-nearby-focus=Follow the pointer across empty ground using invisible, low-priority hover targets, retain the last selected neighbourhood, retain it for 20 ticks, or hide immediately. Pointer sampling becomes coarser when zoomed out to bound work. Real entities keep their normal tooltips. ALT, opened panels and surface or force changes clear contextual recipes.
no-alt-needed-recipe-radius=Inclusive distance from the focus point to each machine's collision footprint. Large machines can be included by their near edge.
no-alt-needed-resources=Optional extracted-product, flamethrower-fuel and tower-input seed icons. Does not gate ordinary inventories or ammunition icons.
no-alt-needed-electricity=Optional network production/demand and accumulator charge. Power is displayed in megawatts (MW); charge is a percentage.
no-alt-needed-ammo-counts=Optional total remaining ammunition rounds. Ordinary hovered ammunition icons remain available when counts are off.
no-alt-needed-auto-alt=Off by default. Temporarily enables native ALT for blueprints, planners and native wires only when ALT was off. Initial and manual choices are preserved; observable interference ends ownership. Another mod writing the same boolean value cannot be detected. Turn this off before removing the mod if it currently owns a temporary activation.
no-alt-needed-fluid-declutter=Startup-global policy shared by all players. Suppresses native fluid icons and arrows together for enabled categories. Custom context and background choices are per player; disabling them does not restore native prototypes. Disable this setting and restart to restore native fluid decorations. Warning sprites are not changed.
no-alt-needed-fluid-context=Show both applicable connection arrows and fluid icons on relevant hover and construction targets. Construction neighbours follow current selection only; losing selection clears that detail. Held-machine preview ports use native build-cursor rendering where geometry is supported.
no-alt-needed-fluid-background=Optional icons-only or arrows-only background inside the local fluid search envelope, even with native ALT off. None is the quiet default. This is custom local presentation, not an independent native-layer switch.
no-alt-needed-fluid-radius=Detailed construction neighbourhood around the currently selected entity. No last-hover, physical-player or camera fallback. Independent of the search envelope; the selected target itself is always eligible when visible.
no-alt-needed-fluid-search-radius=Bounded fluid discovery envelope around the viewed player position. Also bounds optional background presentation. Does not query arbitrary pointer coordinates or silently grow to match the detail radius.
no-alt-needed-fluid-assembling-machine=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-furnace=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-boiler=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-generator=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-mining-drill=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-offshore-pump=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-pump=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-rocket-silo=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-fusion-reactor=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-fusion-generator=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-fluid-thruster=Startup-global category switch. Joint icon/arrow suppression applies only when the main quiet-fluid setting is enabled. Requires restart.
no-alt-needed-inserter-capacity=Configured transfer capacity in items/s, not measured flow. ~ marks additional estimation uncertainty. Stacked belts and unsupported geometry are labelled instead of receiving a misleading rate.
no-alt-needed-warnings=Warnings cover the visible factory, or just the hovered entity. They describe connections, not stock, power or production efficiency. Red: missing; orange: ordinary obstruction; violet: fluid obstruction; pink: incompatible fluid. Full fluid detail also shows green connected and grey unused ports.
no-alt-needed-warning-inserters=Show missing pickup and drop connections. Native inventories and belts, and local ground hand-offs from other inserters or drills, count as connections. Ghosts are not warning hosts.
no-alt-needed-warning-drills=Show missing item-output destinations. Fluid-only drills have no item-output warning.
no-alt-needed-warning-fluids=Independent of fluid icons and yellow construction triangles. Issues shows only problems; Full also marks connected and redundant ports. Pump-to-rail and nonordinary pipe connections are not treated as missing pipes.
no-alt-needed-warning-ignored=Comma- or whitespace-separated internal entity prototype names. Suppresses warnings on those hosts without treating their valid transfers as missing.

