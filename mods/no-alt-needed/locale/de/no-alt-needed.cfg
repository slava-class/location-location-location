[mod-setting-description]
no-alt-needed-hover=Zeigt passende Rezepte, Module, Anforderungen, Inhalte, Filter und Einstellungen des vom Spiel ausgewählten Objekts. Bei nativem ALT zeichnet diese Mod die gewöhnlichen Informationen nicht doppelt.
no-alt-needed-nearby-recipes=Rezeptsymbole um das ausgewählte Objekt oder den Zeiger auf der betrachteten Oberfläche, nicht um den Charakter. Das Fokusexperiment wählt Zeigerverfolgung oder den behaltenen Objektfokus.
no-alt-needed-experiment-nearby-focus=Dem Zeiger über leeren Boden mit unsichtbaren Auswahlhilfen niedriger Priorität folgen, die letzte ausgewählte Umgebung behalten, für 20 Ticks behalten oder sofort ausblenden. Beim Herauszoomen wird die Zeigerabtastung gröber, um die Arbeit zu begrenzen. Echte Objekte behalten ihre normalen Tooltips. ALT, geöffnete Fenster sowie Oberflächen- oder Parteiwechsel löschen den Rezeptfokus.
no-alt-needed-recipe-radius=Einschließlicher Abstand vom Fokuspunkt zur Kollisionsfläche jeder Maschine. Bei großen Gebäuden zählt auch die nahe Kante.
no-alt-needed-resources=Optionale Symbole für Förderprodukte, Flammenwerferbrennstoff und Samen im Eingang eines Agrarturms. Gewöhnliche Inventare und Munitionssymbole bleiben davon unabhängig.
no-alt-needed-electricity=Optionale Anzeige von verfügbarer Netzleistung, Bedarf und Akkuladung. Leistung wird in Megawatt (MW), Ladung in Prozent angegeben.
no-alt-needed-ammo-counts=Optionale Gesamtzahl verbleibender Schuss. Gewöhnliche Munitionssymbole beim Untersuchen bleiben auch ohne Mengenanzeige verfügbar.
no-alt-needed-auto-alt=Standardmäßig aus. Aktiviert natives ALT vorübergehend für Blaupausen, Planer und native Kabel, aber nur wenn ALT zuvor aus war. Anfangszustand und manuelle Entscheidungen bleiben erhalten. Erkennbare fremde Änderungen beenden die Zuständigkeit. Das erneute Schreiben desselben Wahrheitswerts durch eine andere Mod ist nicht erkennbar. Vor dem Entfernen ausschalten, falls gerade eine vorübergehende Aktivierung besteht.
no-alt-needed-fluid-declutter=Globale Startoption für alle Spieler. Blendet native Flüssigkeitssymbole und Pfeile für aktivierte Kategorien gemeinsam aus. Eigene Detail- und Hintergrundanzeigen gelten pro Spieler; ihr Abschalten stellt native Prototypen nicht wieder her. Für native Markierungen diese Option ausschalten und neu starten. Warnsymbole werden nicht verändert.
no-alt-needed-fluid-context=Zeigt passende Anschlusspfeile und Flüssigkeitssymbole beim Untersuchen und Bauen. Benachbarte Baudetails folgen ausschließlich der aktuellen Auswahl und verschwinden ohne Auswahl. Unterstützte Anschlüsse der gehaltenen Maschine nutzen die native Bauvorschau.
no-alt-needed-fluid-background=Optional nur Flüssigkeitssymbole oder nur Pfeile innerhalb des lokalen Suchbereichs, auch ohne natives ALT. Keine ist die ruhige Standardeinstellung. Eigene lokale Darstellung, kein unabhängiger Schalter für native Ebenen.
no-alt-needed-fluid-radius=Detailbereich beim Bauen um das aktuell ausgewählte Objekt. Kein Rückgriff auf eine frühere Auswahl, die physische Spielerposition oder die Kamera. Unabhängig vom Suchbereich; das sichtbare ausgewählte Ziel selbst bleibt zulässig.
no-alt-needed-fluid-search-radius=Begrenzte Flüssigkeitssuche um die betrachtete Spielerposition. Begrenzt auch den optionalen Hintergrund. Ermittelt keine beliebigen Zeigerkoordinaten und wächst nicht stillschweigend auf den Detailradius.
no-alt-needed-fluid-assembling-machine=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-furnace=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-boiler=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-generator=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-mining-drill=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-offshore-pump=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-pump=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-rocket-silo=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-fusion-reactor=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-fusion-generator=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-fluid-thruster=Globale Kategorieoption beim Spielstart. Gemeinsames Ausblenden von Symbolen und Pfeilen nur bei aktivierter Hauptoption. Neustart erforderlich.
no-alt-needed-inserter-capacity=Konfigurierte Förderkapazität in Gegenständen/s, kein gemessener Durchsatz. ~ kennzeichnet zusätzliche Schätzunsicherheit. Gestapelte Fließbänder und nicht unterstützte Geometrie erhalten einen Hinweis statt einer irreführenden Rate.
no-alt-needed-warnings=Warnungen für die sichtbare Fabrik oder nur das ausgewählte Objekt. Sie beschreiben Anschlüsse, nicht Vorrat, Strom oder Produktionseffizienz. Rot: fehlend; orange: gewöhnliches Hindernis; violett: Flüssigkeitshindernis; rosa: unverträgliche Flüssigkeit. Volle Details zeigen auch grüne verbundene und graue ungenutzte Anschlüsse.
no-alt-needed-warning-inserters=Zeigt fehlende Aufnahme- und Ablageverbindungen. Native Inventare, Fließbänder und lokale Bodenübergaben von anderen Greifarmen oder Erzförderern gelten als Verbindungen. Keine Warnungen an Baugeistern.
no-alt-needed-warning-drills=Zeigt fehlende Ziele für Gegenstände. Reine Flüssigkeitsförderer erhalten keine Gegenstandsausgabewarnung.
no-alt-needed-warning-fluids=Unabhängig von Flüssigkeitssymbolen und gelben Baudreiecken. Probleme zeigt nur Fehler; Voll zusätzlich verbundene und redundante Anschlüsse. Pumpenanschlüsse an Schienen und besondere Rohrverbindungen gelten nicht als fehlende Rohre.
no-alt-needed-warning-ignored=Interne Objektprototypnamen, getrennt durch Kommas oder Leerzeichen. Unterdrückt Warnungen an diesen Objekten; ihre gültigen Übergaben zählen weiterhin.

