topic-pressured-steam-material=Superheat
text-pressured-steam-material=Steam is superheated when hotter than its saturation temperature at a specified pressure. Higher temperature does not, by itself, mean higher pressure.
refs-pressured-steam-material=Physics — Game abstraction\n\nUS Department of Energy: Improving Steam System Performance — Section 1 - Why Steam?, Generation, Distribution/Piping, Superheaters and End Use\nhttps://www.energy.gov/sites/default/files/2014/05/f15/steamsourcebook.pdf
topic-pressured-water-material=Pressure without boiling
text-pressured-water-material=Pumps do work to raise water's pressure. Pressurising liquid and vaporising it are different operations; neither creates energy.
