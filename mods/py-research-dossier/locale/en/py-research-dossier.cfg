topic-advanced-distribution-research=Grid coordination
text-advanced-distribution-research=A power network must balance generation and demand while limiting losses and protecting equipment. Bigger conductors, voltage conversion and switching solve different problems; none removes the need to manage current.
refs-advanced-distribution-research=Engineering — Simplified\n\nOak Ridge National Laboratory: Opportunities for Energy Efficiency Improvements in the U.S. Electricity Transmission and Distribution System — Sections 2.1 and 3.1 - conductor and transformer losses; transmission and distribution roles\nhttps://www.energy.gov/sites/prod/files/2015/04/f22/QER%20Analysis%20-%20Opportunities%20for%20Energy%20Efficiency%20Improvements%20in%20the%20US%20Electricity%20Transmission%20and%20Distribution%20System_0.pdf
topic-steam-power-research=Energy and working fluid
text-steam-power-research=Water transports energy through a steam cycle. Pumps add work, boilers add heat, and expansion can produce work. Tracking both energy and material flows prevents treating steam itself as the original fuel.
refs-steam-power-research=Engineering — Simplified\n\nUS Department of Energy: Improving Steam System Performance — Section 1 - Why Steam?, Generation, Distribution/Piping, Superheaters and End Use\nhttps://www.energy.gov/sites/default/files/2014/05/f15/steamsourcebook.pdf
topic-thermal-power-research=Conversion chain
text-thermal-power-research=A thermal power plant converts heat into mechanical work and then electricity. Each stage has losses and operating limits; improving a boiler cannot remove losses in the turbine, generator or electrical network.
refs-thermal-power-research=Engineering — Simplified\n\nUS Department of Energy: Improving Steam System Performance — Section 1 - Why Steam?, Generation, Distribution/Piping, Superheaters and End Use\nhttps://www.energy.gov/sites/default/files/2014/05/f15/steamsourcebook.pdf\n\nOak Ridge National Laboratory: Opportunities for Energy Efficiency Improvements in the U.S. Electricity Transmission and Distribution System — Sections 2.1 and 3.1 - conductor and transformer losses; transmission and distribution roles\nhttps://www.energy.gov/sites/prod/files/2015/04/f22/QER%20Analysis%20-%20Opportunities%20for%20Energy%20Efficiency%20Improvements%20in%20the%20US%20Electricity%20Transmission%20and%20Distribution%20System_0.pdf
topic-steam-cycle-research=Closing the cycle
text-steam-cycle-research=Condensing exhaust steam and pumping the liquid back closes a steam cycle. Fuel type changes how heat is supplied; the working-fluid loop still needs heat input, expansion, cooling and circulation.
refs-steam-cycle-research=Engineering — Simplified\n\nUS Department of Energy: Improving Steam System Performance — Section 1 - Why Steam?, Generation, Distribution/Piping, Superheaters and End Use\nhttps://www.energy.gov/sites/default/files/2014/05/f15/steamsourcebook.pdf
topic-geothermal-research=Geothermal resources
text-geothermal-research=Useful geothermal power needs heat, a fluid to transport it, and connected pathways through rock. A hot rock deposit alone is not a complete generating system; circulation and heat rejection matter too.
refs-geothermal-research=Geology — Simplified\n\nUS Department of Energy: Geothermal Electricity Generation — Geothermal Power Generation Technologies and Geothermal Power Plants - heat, fluid, permeability and conversion cycles\nhttps://www.energy.gov/hgeo/geothermal/geothermal-electricity-generation
topic-creosote-research=Wood preservation
text-creosote-research=Preservation protects organic material against decay rather than making it metallic. Coal-tar creosote is an industrial wood preservative; durability, strength and electrical insulation remain different material properties.
refs-creosote-research=Chemistry — Simplified\n\nUS EPA: Overview of Wood Preservative Chemicals — Creosote - coal-tar origin, industrial wood preservation and health/environmental precautions\nhttps://www.epa.gov/ingredients-used-pesticide-products/overview-wood-preservative-chemicals#creosote
topic-treated-wood-material=Durability
text-treated-wood-material=Preservatives inhibit organisms that degrade wood. Treatment can extend service life, but it does not turn wood into metal or replace electrical insulation.
refs-treated-wood-material=Biology — Simplified\n\nUS EPA: Overview of Wood Preservative Chemicals — Creosote - coal-tar origin, industrial wood preservation and health/environmental precautions\nhttps://www.epa.gov/ingredients-used-pesticide-products/overview-wood-preservative-chemicals#creosote
topic-creosote-material=Coal-tar preservative
text-creosote-material=Coal-tar creosote contains compounds that inhibit wood-destroying organisms. Its toxicity also makes it hazardous to people and other organisms.
refs-creosote-material=Chemistry — Real principle\n\nUS EPA: Overview of Wood Preservative Chemicals — Creosote - coal-tar origin, industrial wood preservation and health/environmental precautions\nhttps://www.epa.gov/ingredients-used-pesticide-products/overview-wood-preservative-chemicals#creosote
topic-niobium-research=Alloy additions
text-niobium-research=Niobium is used mainly as an alloying addition in steels and superalloys. Selecting an alloy requires considering strength, corrosion resistance, operating temperature and manufacturing constraints separately.
refs-niobium-research=Metallurgy — Simplified\n\nUSGS: Niobium and Tantalum Statistics and Information — Niobium and Tantalum Insights and Data - alloy additions in steels and superalloys\nhttps://www.usgs.gov/centers/national-minerals-information-center/niobium-and-tantalum-statistics-and-information\n\nUS Department of Energy: Improving Steam System Performance — Section 1 - Why Steam?, Generation, Distribution/Piping, Superheaters and End Use\nhttps://www.energy.gov/sites/default/files/2014/05/f15/steamsourcebook.pdf
topic-casting-research=Shaping by solidification
text-casting-research=Casting uses a mould to shape liquid metal as it freezes. The mould and cooling conditions influence the result; choosing a manufacturing route is separate from deciding how the finished part will be used.
refs-casting-research=Metallurgy — Simplified\n\nUS Department of Energy: Implementation of Metal Casting Best Practices — Section 2, Metal Casting Industry Overview - moulds, molten metal and solidification\nhttps://www1.eere.energy.gov/manufacturing/resources/metalcasting/pdfs/implementation_final.pdf
topic-biofluid-research=Dedicated transport
text-biofluid-research=Living systems maintain separate fluid environments with barriers and controlled exchange. This fictional biofluid network illustrates that distinction: the transport medium and its connections are design choices, not simply larger versions of ordinary plumbing.
