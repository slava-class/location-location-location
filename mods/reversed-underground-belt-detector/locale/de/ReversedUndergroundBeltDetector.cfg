[reversed-underground-belt-detector]
warning=Umgekehrtes Untergrundband: __1__
input=Eingang
output=Ausgang

[mod-setting-name]
reversed_underground_belt_detector_alerts=Kartenwarnungen für umgekehrte unterirdische Fließbänder
reversed_underground_belt_detector_overlay=Warnpfeile für unterirdische Fließbänder

[mod-setting-description]
reversed_underground_belt_detector_alerts=Zeigt Kartenwarnungen für umgekehrte unterirdische Fließbänder. Standardmäßig eingeschaltet. Unabhängig von den Warnpfeilen. Gilt nur für deine Warnmeldungen.
reversed_underground_belt_detector_overlay=Wähle pulsierende, gleichbleibende oder keine Warnpfeile. Standardmäßig pulsierend. Beim Überfahren eines unterirdischen Ein- oder Ausgangs wird nur die Pfeilreihe dieser Verbindung in deiner Ansicht ausgeblendet. Andere Fließbänder und Mitspieler bleiben unberührt. Kartenwarnungen werden separat eingestellt.

[string-mod-setting]
reversed_underground_belt_detector_overlay-pulsing=Pulsierend
reversed_underground_belt_detector_overlay-steady=Gleichbleibend (ohne Pulsieren)
reversed_underground_belt_detector_overlay-off=Aus
