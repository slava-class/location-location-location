[reversed-underground-belt-detector]
warning=Convoyeur souterrain inversé : __1__
input=entrée
output=sortie

[mod-setting-name]
reversed_underground_belt_detector_alerts=Alertes de carte pour convoyeurs souterrains inversés
reversed_underground_belt_detector_overlay=Flèches d'alerte des convoyeurs souterrains

[mod-setting-description]
reversed_underground_belt_detector_alerts=Affiche des alertes sur la carte pour les convoyeurs souterrains inversés. Activé par défaut. Indépendant des flèches d'alerte. Ne concerne que vos alertes.
reversed_underground_belt_detector_overlay=Choisissez des flèches pulsantes, fixes ou aucune flèche. Pulsantes par défaut. Survoler une entrée ou sortie souterraine masque uniquement les flèches de cette liaison dans votre vue. Les autres convoyeurs et les vues des autres joueurs restent inchangés. Les alertes de carte se règlent séparément.

[string-mod-setting]
reversed_underground_belt_detector_overlay-pulsing=Pulsantes
reversed_underground_belt_detector_overlay-steady=Fixes (sans pulsation)
reversed_underground_belt_detector_overlay-off=Désactivées
