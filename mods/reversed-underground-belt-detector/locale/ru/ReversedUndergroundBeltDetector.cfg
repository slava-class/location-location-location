warning=Возможно, подземное соединение развёрнуто (__1__)
input=вход
output=выход
planner-instructions=Выделить (__CONTROL__select-for-blueprint__): отметить как намеренное\nВыделить (__CONTROL__select-for-cancel-deconstruct__): восстановить предупреждения
acknowledged=Соединений отмечено как намеренные: __1__
