[item-name]
reversed-underground-belt-detector-warning-planner=Управление подземными предупреждениями

[item-description]
reversed-underground-belt-detector-warning-planner=Отмечайте существующие предупреждения как намеренные или восстанавливайте их. Выберите любой конец или несколько соединений. Действует для вашей команды и сохраняется до изменения соединения. Не исключает область или будущие предупреждения.

[mod-setting-name]
reversed_underground_belt_detector_alerts=Оповещения на карте об обратных подземных конвейерах
reversed_underground_belt_detector_overlay=Стрелки предупреждения о подземных конвейерах

[mod-setting-description]
reversed_underground_belt_detector_alerts=Показывает на карте оповещения о подземных конвейерах, направленных против потока. По умолчанию включено. Не зависит от режима стрелок. Влияет только на ваши оповещения.
reversed_underground_belt_detector_overlay=Выберите пульсирующие, постоянные или выключенные стрелки. По умолчанию включена пульсация. При наведении на подземный вход или выход скрываются только стрелки этого соединения в вашем виде. Другие конвейеры и виды других игроков не меняются. Оповещения на карте настраиваются отдельно.

[string-mod-setting]
reversed_underground_belt_detector_overlay-pulsing=Пульсация
reversed_underground_belt_detector_overlay-steady=Постоянные (без пульсации)
reversed_underground_belt_detector_overlay-off=Выключены
