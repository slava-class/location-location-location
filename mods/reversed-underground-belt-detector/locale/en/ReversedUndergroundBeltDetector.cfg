[item-name]
reversed-underground-belt-detector-warning-planner=Manage underground warnings

[item-description]
reversed-underground-belt-detector-warning-planner=Mark existing warnings as intentional, or restore them. Select either mouth or several connections. Applies to your force and is saved until the connection changes. Does not ignore an area or future warnings.

[mod-setting-name]
reversed_underground_belt_detector_alerts=Map alerts for reversed underground belts
reversed_underground_belt_detector_overlay=Underground warning overlay

[mod-setting-description]
reversed_underground_belt_detector_alerts=Show map alerts for reversed underground belts. On by default. Independent of the overlay mode. Applies only to your alerts.
reversed_underground_belt_detector_overlay=Choose pulsing arrows, steady arrows, or no overlay. Pulsing is the default. Hovering an underground entrance or exit hides only that connection's span in your view. Other belts and other players' overlays are unaffected. Map alerts are controlled separately.

[string-mod-setting]
reversed_underground_belt_detector_overlay-pulsing=Pulsing
reversed_underground_belt_detector_overlay-steady=Steady (no pulse)
reversed_underground_belt_detector_overlay-off=Off
