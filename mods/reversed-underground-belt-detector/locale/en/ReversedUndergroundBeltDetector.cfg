warning=Possible reversed underground connection (__1__)
input=entrance
output=exit
planner-instructions=Drag (__CONTROL__select-for-blueprint__): mark intentional\nDrag (__CONTROL__select-for-cancel-deconstruct__): restore warnings
acknowledged=Connections marked intentional: __1__
