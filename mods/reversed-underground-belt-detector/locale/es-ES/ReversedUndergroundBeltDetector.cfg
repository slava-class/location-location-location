[reversed-underground-belt-detector]
warning=Posible conexión subterránea invertida (__1__)
input=entrada
output=salida
planner-instructions=Arrastrar (__CONTROL__select-for-blueprint__): marcar como intencional\nArrastrar (__CONTROL__select-for-cancel-deconstruct__): restaurar avisos
acknowledged=Conexiones marcadas como intencionales: __1__
restored=Conexiones con avisos restaurados: __1__

[item-name]
reversed-underground-belt-detector-warning-planner=Gestionar avisos subterráneos

[item-description]
reversed-underground-belt-detector-warning-planner=Marca avisos existentes como intencionales o restáuralos. Selecciona cualquiera de los extremos o varias conexiones. Se aplica a tu equipo y se guarda hasta que cambie la conexión. No ignora una zona ni avisos futuros.

[mod-setting-name]
reversed_underground_belt_detector_alerts=Alertas del mapa para cintas subterráneas invertidas
reversed_underground_belt_detector_overlay=Superposición de aviso de cintas subterráneas

[mod-setting-description]
reversed_underground_belt_detector_alerts=Muestra alertas en el mapa para las cintas subterráneas invertidas. Activado por defecto. Independiente de la superposición. Solo afecta a tus alertas.
reversed_underground_belt_detector_overlay=Elige flechas pulsantes, fijas o ninguna superposición. Pulsantes por defecto. Al pasar el cursor sobre una entrada o salida subterránea, solo se ocultan las flechas de esa conexión en tu vista. Las otras cintas y las vistas de los demás jugadores no cambian. Las alertas del mapa se controlan por separado.

[string-mod-setting]
reversed_underground_belt_detector_overlay-pulsing=Pulsante
reversed_underground_belt_detector_overlay-steady=Fija (sin pulsación)
reversed_underground_belt_detector_overlay-off=Desactivada
