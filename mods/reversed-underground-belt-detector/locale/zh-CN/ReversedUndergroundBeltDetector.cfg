[reversed-underground-belt-detector]
warning=反向地下传送带__1__
input=入口
output=出口

[mod-setting-name]
reversed_underground_belt_detector_alerts=反向地下传送带地图警报
reversed_underground_belt_detector_overlay=地下传送带警告箭头

[mod-setting-description]
reversed_underground_belt_detector_alerts=为反向地下传送带显示地图警报。默认开启，与警告箭头模式无关。此设置仅影响你自己的警报。
reversed_underground_belt_detector_overlay=选择脉冲、固定显示或关闭箭头。默认为脉冲。鼠标悬停在地下传送带入口或出口时，仅隐藏该连接在你视图中的跨段箭头。其他传送带和其他玩家的视图不受影响。地图警报单独控制。

[string-mod-setting]
reversed_underground_belt_detector_overlay-pulsing=脉冲
reversed_underground_belt_detector_overlay-steady=固定显示（无脉冲）
reversed_underground_belt_detector_overlay-off=关闭
