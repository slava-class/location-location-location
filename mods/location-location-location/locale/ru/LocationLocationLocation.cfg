add-consumer-tooltip=[font=default-semibold]__1__[/font]\nДобавляет ближайшую машину, настроенный рецепт которой использует этот выход как ингредиент. Поиск охватывает машины вашей команды в открытых областях карты и на её космических платформах.\n\nСохраняет прежних получателей. Сохраните изменения кнопкой «Применить».
find-consumer-tooltip=[font=default-semibold]__1__[/font]\nПоказывает ближайшую машину, настроенный рецепт которой использует этот выход как ингредиент, временной навигационной меткой.\n\nПоказывает расстояние и направление, не меняя получателей выходов.
