pin-tooltip=Закрепляет черновик рядом с миром для поиска источников при ходьбе или в удалённом виде. Изменения остаются личными до нажатия «Применить».
expand-tooltip=Разворачивает тот же черновик, чтобы изменить рецепт, имя и подпись или посмотреть мини-карту.
move-marker-tooltip=__CONTROL__select-for-blueprint__: ставит метку в центр выбранной области. Не перемещает здания и не размещает чертежи.
reset-marker-tooltip=Удаляет выбранное вручную место и предлагает положение по назначенным источникам.
