add-closest-tooltip=[font=default-semibold]__1__[/font]\nДобавляет ближайшую машину, рецепт которой производит этот ингредиент. Поиск охватывает машины вашей команды в открытых областях карты и на её космических платформах.\n\nСохраняет прежние источники. Сохраните изменения кнопкой «Применить».
find-closest-tooltip=[font=default-semibold]__1__[/font]\nПоказывает ближайшую машину, рецепт которой производит этот ингредиент, временной навигационной меткой. Поиск охватывает машины вашей команды в открытых областях карты и на её космических платформах.\n\nПоказывает расстояние и направление, не меняя источники.
