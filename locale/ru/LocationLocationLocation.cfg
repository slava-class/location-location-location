tool-instructions=Выберите ингредиент, чтобы указать его источники. __CONTROL__select-for-blueprint__: заменить; __CONTROL__select-for-cancel-deconstruct__: добавить; __CONTROL__reverse-select__: удалить. При выборе места __CONTROL__select-for-blueprint__ ставит метку в центр области.
