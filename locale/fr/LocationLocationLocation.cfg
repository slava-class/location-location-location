[mod-setting-name]
location_location_location_generate_underground_alerts=Alertes de carte pour convoyeurs souterrains inversés
location_location_location_underground_overlay=Flèches d'alerte des convoyeurs souterrains

[mod-setting-description]
location_location_location_generate_underground_alerts=Affiche des alertes sur la carte pour les convoyeurs souterrains inversés. Activé par défaut. Indépendant des flèches d'alerte. Ne concerne que vos alertes.
location_location_location_underground_overlay=Choisissez des flèches pulsantes, fixes ou aucune flèche. Pulsantes par défaut. Survoler une entrée ou sortie souterraine masque uniquement les flèches de cette liaison dans votre vue. Les autres convoyeurs et les vues des autres joueurs restent inchangés. Les alertes de carte se règlent séparément.

[string-mod-setting]
location_location_location_underground_overlay-pulsing=Pulsantes
location_location_location_underground_overlay-steady=Fixes (sans pulsation)
location_location_location_underground_overlay-off=Désactivées
