topic-vrauk-cocoon-biology=Cocoon analogue
text-vrauk-cocoon-biology=In many moths, a caterpillar spins a silk covering around its pupa. The cocoon is that protective covering, not the developing insect itself.
refs-vrauk-cocoon-biology=Biology — Fictional species; real-world analogue\n\nSmithsonian National Museum of Natural History: Insect Zoo — Section 3, Thriving through Change; sections 7-9, silk, moth cocoons and pupae\nhttps://naturalhistory.si.edu/visit/accessibility/audio-and-visual-description/insect-zoo-audio-description-tour
topic-auog-biology=Respiration analogue
text-auog-biology=Oxygen lets animal cells extract energy from food, producing carbon dioxide and water. This supports movement and maintenance, even when growth has stopped.
