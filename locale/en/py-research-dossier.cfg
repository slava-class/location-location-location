topic-boron-oxide-material=Glass former
text-boron-oxide-material=Boron oxide can build a glass network rather than crystallising. Combining it with silica changes glass properties; borosilicate glass is not simply pure silica.
refs-boron-oxide-material=Chemistry — Real principle\n\nMIT OpenCourseWare: 3.091 Introduction to Solid State Chemistry - Glasses — Lecture notes 7, sections 1 and 3-6: viscosity, glass formation, network modifiers and cooling\nhttps://ocw.mit.edu/courses/3-091sc-introduction-to-solid-state-chemistry-fall-2010/89de42af0f13332961162dbddbeddddc_MIT3_091SCF09_aln07.pdf\n\nUS Borax: Boric Oxide — Applications and Technical details - glass formation and borosilicate properties\nhttps://www.borax.com/products/boric-oxide
topic-boron-oxide-powder=Surface area
text-boron-oxide-powder=Grinding leaves the chemical formula unchanged but exposes more surface. Finer oxide particles can mix and react more readily than larger lumps.
refs-boron-oxide-powder=Chemistry — Real principle\n\nOpenStax: Chemistry 2e — 12.2 Factors Affecting Reaction Rates - The Physical States of the Reactants\nhttps://openstax.org/books/chemistry-2e/pages/12-2-factors-affecting-reaction-rates
topic-boron-mixture-material=Mixture and reaction
text-boron-mixture-material=A mixture combines substances without requiring a chemical reaction. Reacting its components changes chemical identities; simply blending them changes their distribution.
refs-boron-mixture-material=Chemistry — Simplified\n\nOpenStax: Chemistry 2e — 1.2 Phases and Classification of Matter - conservation, mixtures, compounds and decomposition of water\nhttps://openstax.org/books/chemistry-2e/pages/1-2-phases-and-classification-of-matter
topic-boron-material=Metalloid bonding
text-boron-material=Crystalline boron builds complex networks containing twelve-atom clusters. Its bonding produces a hard solid with semiconducting behaviour, rather than a typical conducting metal.
refs-boron-material=Chemistry — Real principle\n\nTaro Saito: Inorganic Chemistry (Chemistry LibreTexts) — 4.2(a) Boron - crystalline boron clusters, semiconductor properties and diborane bridge bonding\nhttps://chem.libretexts.org/Bookshelves/Inorganic_Chemistry/Inorganic_Chemistry_%28Saito%29/04%3A_Chemistry_of_Nonmetallic_Elements/4.02%3A_Main_group_elements_of_2nd_and_3rd_periods_and_their_compounds
topic-boron-carbide-material=Neutron capture
text-boron-carbide-material=Boron carbide is used in reactor control rods because boron absorbs neutrons. This affects atomic nuclei, unlike the electron rearrangements in ordinary chemical reactions.
refs-boron-carbide-material=Physics — Real principle\n\nUS Borax: Boron in Nuclear Energy — How does boron help control nuclear reactions? - neutron absorption and boron-carbide control rods\nhttps://www.borax.com/applications/nuclear-energy
topic-borax-miners=Two extraction routes
text-borax-miners=Borate ores can be excavated, while dissolved borates can be recovered from brines. Py's syngas-fed miner combines extraction and handling into one machine.
refs-borax-miners=Geology — Game abstraction\n\nUSGS: Mineral Commodity Summaries 2026 - Boron — Production, mineral deposits, extraction from ores and brines; elemental boron does not occur naturally\nhttps://pubs.usgs.gov/periodicals/mcs2026/mcs2026-boron.pdf
topic-borax-washing=Separating minerals
text-borax-washing=Washing separates useful minerals from unwanted rock and clay; it does not manufacture boron atoms. Py represents the rejected material as muddy sludge.
refs-borax-washing=Engineering — Simplified\n\nSepro: Introduction to Mineral Processing or Beneficiation — Sections 1.1-1.3, Mineral processing, ores, gangue and concentrates\nhttps://www.seprosystems.com/mineral-processing-introduction/\n\nUSGS: Mineral Commodity Summaries 2026 - Boron — Production, mineral deposits, extraction from ores and brines; elemental boron does not occur naturally\nhttps://pubs.usgs.gov/periodicals/mcs2026/mcs2026-boron.pdf
topic-boric-acid-process=Hydrolysis
text-boric-acid-process=Diborane reacts with water to form boric acid and hydrogen gas. Py models the acid output but omits the hydrogen coproduct.
refs-boric-acid-process=Chemistry — Game abstraction\n\nCDC/NIOSH: Pocket Guide to Chemical Hazards - Diborane — Incompatibilities and Reactivities - water produces hydrogen and boric acid\nhttps://www.cdc.gov/niosh/npg/npgd0183.html
topic-boron-oxide-process=Dehydration
text-boron-oxide-process=Heating boric acid removes water in stages, leaving boron oxide. This is a chemical transformation, not just boiling a liquid dry; Py omits the released water.
refs-boron-oxide-process=Chemistry — Simplified\n\nUS Borax: Optibor Boric Acid — Technical details - aqueous acidity, staged dehydration to metaboric acid and boron oxide\nhttps://www.borax.com/products/optibor
topic-boron-milling=Size distribution
text-boron-milling=Mills produce a range of particle sizes. Classification separates them so coarse particles can return for further grinding; Py represents the result as one powder.
refs-boron-milling=Engineering — Simplified\n\nSepro: Introduction to Mineral Processing or Beneficiation — Sections 3.1-3.2, Liberation and comminution; crushing and grinding\nhttps://www.seprosystems.com/mineral-processing-introduction/\n\nSepro: Introduction to Mineral Processing or Beneficiation — Section 4, Size separation: screening and classification\nhttps://www.seprosystems.com/mineral-processing-introduction/
topic-boron-coproducts=Coupled outputs
text-boron-coproducts=A process can produce several useful substances at once. Py's elemental-boron route also supplies diborane, so demand for either output affects how much of the other must be handled.
refs-boron-coproducts=Engineering — Game abstraction\n\nMIT OpenCourseWare: 15.772J D-Lab Supply Chains - Process Analysis — Problem Set 2, problems 1-3: batches, setup, inventory, flow rate and bottlenecks\nhttps://ocw.mit.edu/courses/15-772j-d-lab-supply-chains-fall-2014/f17bfc0d70c0a4009931352e72ad7716_MIT15_772JF14_ProblemSet2.pdf
topic-simik-boron-analogue=Element recycling
text-simik-boron-analogue=Organisms redistribute mineral elements rather than create them. Recovering boron from biological material requires boron to have entered the system; Py's Simik routes are fictional analogues.
refs-simik-boron-analogue=Biology — Fictional species; real-world analogue\n\nOpenStax: Biology 2e — 31.1 Nutritional Requirements of Plants - Essential Nutrients; Macronutrients and Micronutrients\nhttps://openstax.org/books/biology-2e/pages/31-1-nutritional-requirements-of-plants\n\nUSGS: Mineral Commodity Summaries 2026 - Boron — Production, mineral deposits, extraction from ores and brines; elemental boron does not occur naturally\nhttps://pubs.usgs.gov/periodicals/mcs2026/mcs2026-boron.pdf
topic-boron-research=Chemical form
text-boron-research=An element's chemistry depends on its compounds, not just its name. Boron in an oxygen-rich borate behaves differently from boron in a hydride, oxide or carbide; processing connects those forms.
refs-boron-research=Chemistry — Real principle\n\nUSGS: Mineral Commodity Summaries 2026 - Boron — Production, mineral deposits, extraction from ores and brines; elemental boron does not occur naturally\nhttps://pubs.usgs.gov/periodicals/mcs2026/mcs2026-boron.pdf\n\nTaro Saito: Inorganic Chemistry (Chemistry LibreTexts) — 4.2(a) Boron - crystalline boron clusters, semiconductor properties and diborane bridge bonding\nhttps://chem.libretexts.org/Bookshelves/Inorganic_Chemistry/Inorganic_Chemistry_%28Saito%29/04%3A_Chemistry_of_Nonmetallic_Elements/4.02%3A_Main_group_elements_of_2nd_and_3rd_periods_and_their_compounds
topic-boron-refining-research=Purity and particle size
text-boron-refining-research=Purity describes chemical composition; particle size describes physical form. A fine powder is not necessarily purer than a coarse solid. Grinding, separation and chemical conversion solve different material-processing problems.
