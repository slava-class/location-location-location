topic-gasoline-material=Octane rating
text-gasoline-material=Octane rating measures resistance to engine knock: unwanted auto-ignition under compression. It is not simply the percentage of octane molecules in the fuel.
refs-gasoline-material=Chemistry — Real principle\n\nUS EIA: Gasoline Explained - Octane in Depth — What is octane? How does the octane level affect my vehicle? - knock resistance and reference fuels\nhttps://www.eia.gov/energyexplained/gasoline/octane-in-depth.php
topic-oxygen-material=Oxidiser
text-oxygen-material=Oxygen supports combustion but is not itself a fuel. In many burning reactions it combines with other elements, producing oxides and releasing energy.
